name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install backend style checker
        run: python -m pip install ruff==0.17.1
      - name: Lint backend
        run: ruff check backend
      - name: Check backend formatting
        run: ruff format --check backend
      - name: Run isolated backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Check formatting of changed frontend files
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
